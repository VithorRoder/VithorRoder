name: Update profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - assets/profile-dashboard.template.svg
      - scripts/update-profile-svg.mjs

permissions:
  contents: write

concurrency:
  group: update-profile-dashboard
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh GitHub Activity
        run: node scripts/update-profile-svg.mjs

      - name: Commit updated dashboard
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-dashboard.svg; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-dashboard.svg
          git commit -m "chore: refresh profile activity"
          git push
