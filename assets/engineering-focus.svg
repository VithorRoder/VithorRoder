<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="230" viewBox="0 0 1400 230" role="img" aria-labelledby="focus-title focus-description">
  <title id="focus-title">Engineering Focus</title>
  <desc id="focus-description">Four cards covering backend engineering, data and persistence, cloud and delivery, and user experiences.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#08182d"/>
    </linearGradient>
    <style>
      .card { fill: #151b23; stroke: #30363d; stroke-width: 2; }
      .icon-ring { fill: #0d1b2a; stroke: #58a6ff; stroke-width: 2; }
      .icon { fill: none; stroke: #58a6ff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #f0f6fc; font: 700 24px Arial, sans-serif; }
      .description { fill: #8b949e; font: 17px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="230" rx="18" fill="url(#background)" stroke="#30363d" stroke-width="2"/>

  <g transform="translate(24 20)">
    <g>
      <rect class="card" width="320" height="190" rx="18"/>
      <circle class="icon-ring" cx="48" cy="48" r="23"/>
      <path class="icon" d="M35 48h26M48 35v26"/>
      <text class="title" x="24" y="108">Backend Engineering</text>
      <text class="description" x="24" y="142">Secure APIs, clean boundaries</text>
      <text class="description" x="24" y="170">and automated testing.</text>
    </g>

    <g transform="translate(344)">
      <rect class="card" width="320" height="190" rx="18"/>
      <circle class="icon-ring" cx="48" cy="48" r="23"/>
      <ellipse class="icon" cx="48" cy="42" rx="14" ry="7"/>
      <path class="icon" d="M34 42v16c0 9 28 9 28 0V42"/>
      <text class="title" x="24" y="108">Data &amp; Persistence</text>
      <text class="description" x="24" y="142">Relational modeling and</text>
      <text class="description" x="24" y="170">efficient persistence layers.</text>
    </g>

    <g transform="translate(688)">
      <rect class="card" width="320" height="190" rx="18"/>
      <circle class="icon-ring" cx="48" cy="48" r="23"/>
      <path class="icon" d="M31 56c0-9 8-16 17-16 6 0 12 3 15 9 8 0 14 5 14 12H31z"/>
      <text class="title" x="24" y="108">Cloud &amp; Delivery</text>
      <text class="description" x="24" y="142">Containers, CI/CD and</text>
      <text class="description" x="24" y="170">reliable cloud deployments.</text>
    </g>

    <g transform="translate(1032)">
      <rect class="card" width="320" height="190" rx="18"/>
      <circle class="icon-ring" cx="48" cy="48" r="23"/>
      <rect class="icon" x="33" y="36" width="30" height="23" rx="3"/>
      <path class="icon" d="M41 65h14"/>
      <text class="title" x="24" y="108">User Experiences</text>
      <text class="description" x="24" y="142">Practical web and desktop</text>
      <text class="description" x="24" y="170">interfaces backed by logic.</text>
    </g>
  </g>
</svg>
