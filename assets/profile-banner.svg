<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Vithor Roder &#8212; Full-Stack Developer</title>
  <desc id="banner-description">Animated technology banner with a moving grid, glowing circuits, and software engineering specialties.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".48" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#071a14"/>
    </linearGradient>

    <radialGradient id="blue-glow">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="green-glow">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".34"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3fb950" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#58a6ff" stroke-opacity=".12" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#3fb950" fill-opacity=".35"/>
    </pattern>

    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="title-shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#58a6ff" flood-opacity=".28"/>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="898" height="278" rx="18"/>
    </clipPath>

    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="280" fill="url(#background)"/>

    <g class="motion">
      <circle cx="90" cy="60" r="210" fill="url(#blue-glow)">
        <animate attributeName="cx" values="90;210;90" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;105;60" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="825" cy="230" r="230" fill="url(#green-glow)">
        <animate attributeName="cx" values="825;710;825" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;175;230" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="900" height="280" fill="url(#grid)"/>

    <g class="motion" fill="none" stroke-linecap="round">
      <path d="M0 69H145L177 101H266" stroke="#58a6ff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="9 13">
        <animate attributeName="stroke-dashoffset" values="0;-44" dur="3.8s" repeatCount="indefinite"/>
      </path>
      <path d="M900 64H770L738 96H650" stroke="#3fb950" stroke-opacity=".55" stroke-width="2" stroke-dasharray="9 13">
        <animate attributeName="stroke-dashoffset" values="0;44" dur="4.2s" repeatCount="indefinite"/>
      </path>
      <path d="M0 220H128L160 188H240" stroke="#3fb950" stroke-opacity=".38" stroke-width="2" stroke-dasharray="7 15">
        <animate attributeName="stroke-dashoffset" values="0;-44" dur="4.6s" repeatCount="indefinite"/>
      </path>
      <path d="M900 218H784L752 186H662" stroke="#58a6ff" stroke-opacity=".38" stroke-width="2" stroke-dasharray="7 15">
        <animate attributeName="stroke-dashoffset" values="0;44" dur="4s" repeatCount="indefinite"/>
      </path>
      <circle cx="177" cy="101" r="4" fill="#58a6ff" stroke="none" filter="url(#soft-glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="738" cy="96" r="4" fill="#3fb950" stroke="none" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;.35;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g class="motion">
      <rect x="0" y="-42" width="900" height="42" fill="url(#scan)">
        <animate attributeName="y" values="-42;280" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <circle cx="118" cy="246" r="2.2" fill="#58a6ff">
        <animate attributeName="cy" values="246;34;246" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="805" cy="42" r="2.2" fill="#3fb950">
        <animate attributeName="cy" values="42;244;42" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.9;0" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g class="ui">
      <circle cx="26" cy="24" r="5" fill="#ff5f56"/>
      <circle cx="44" cy="24" r="5" fill="#ffbd2e"/>
      <circle cx="62" cy="24" r="5" fill="#27c93f"/>
      <text x="84" y="29" fill="#8b949e" font-size="12" letter-spacing="1.4">PROFILE.EXE</text>

      <g transform="translate(450 82)">
        <rect x="-111" y="-18" width="222" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
        <circle cx="-88" cy="-1" r="5" fill="#3fb950" filter="url(#soft-glow)">
          <animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="-74" y="4" fill="#8b949e" font-size="12" font-weight="600" letter-spacing="1.2">AVAILABLE TO BUILD</text>
      </g>

      <text x="450" y="142" text-anchor="middle" fill="url(#title-gradient)" font-size="46" font-weight="750" letter-spacing="4" filter="url(#title-shadow)">VITHOR RODER</text>
      <text x="450" y="178" text-anchor="middle" fill="#3fb950" font-size="18" font-weight="700" letter-spacing="3">FULL-STACK DEVELOPER</text>

      <g transform="translate(450 204)">
        <rect x="-230" y="-15" width="460" height="30" rx="15" fill="#0d1117" fill-opacity=".72" stroke="#30363d"/>
        <text class="mono" x="0" y="5" text-anchor="middle" fill="#c9d1d9" font-size="13">Java &amp; Spring  &#8226;  Cloud &amp; DevOps  &#8226;  Clean Architecture</text>
      </g>

      <text class="mono" x="450" y="250" text-anchor="middle" fill="#58a6ff" font-size="12" letter-spacing="1.1">BUILDING RELIABLE SOFTWARE, ONE COMMIT AT A TIME</text>
      <rect x="683" y="240" width="2" height="14" fill="#58a6ff">
        <animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="278" rx="18" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>