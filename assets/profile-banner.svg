<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Software engineering banner</title>
  <desc id="banner-description">Minimal blue banner about building reliable software with Java, Spring, Cloud, and DevOps.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".52" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#08182d"/>
    </linearGradient>

    <radialGradient id="glow-left">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-right">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#58a6ff" stroke-opacity=".065" stroke-width="1"/>
    </pattern>

    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="898" height="178" rx="16"/>
    </clipPath>

    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="180" fill="url(#background)"/>
    <circle cx="65" cy="35" r="190" fill="url(#glow-left)"/>
    <circle cx="850" cy="150" r="210" fill="url(#glow-right)"/>
    <rect width="900" height="180" fill="url(#grid)"/>

    <g class="motion" fill="none" stroke="#58a6ff" stroke-linecap="round">
      <path d="M0 44H154L178 68H258" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="7 14">
        <animate attributeName="stroke-dashoffset" values="0;-42" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M900 136H748L724 112H642" stroke-opacity=".26" stroke-width="1.5" stroke-dasharray="7 14">
        <animate attributeName="stroke-dashoffset" values="0;42" dur="5.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="178" cy="68" r="3" fill="#58a6ff" stroke="none" filter="url(#soft-glow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="724" cy="112" r="3" fill="#58a6ff" stroke="none" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g class="ui">
      <g transform="translate(24 22)">
        <circle cx="0" cy="0" r="3.5" fill="#1f6feb"/>
        <circle cx="14" cy="0" r="3.5" fill="#388bfd"/>
        <circle cx="28" cy="0" r="3.5" fill="#58a6ff"/>
        <text class="mono" x="45" y="4" fill="#6e7681" font-size="10" letter-spacing="1.4">ENGINEERING / SYSTEMS / CLOUD</text>
      </g>

      <text x="450" y="83" text-anchor="middle" fill="#f0f6fc" font-size="29" font-weight="650" letter-spacing="2.6">BUILDING RELIABLE SOFTWARE</text>
      <rect x="290" y="98" width="320" height="1.5" rx=".75" fill="url(#accent)"/>
      <text class="mono" x="450" y="124" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1.8">JAVA  /  SPRING  /  CLOUD  /  DEVOPS</text>
      <text class="mono" x="450" y="153" text-anchor="middle" fill="#6e7681" font-size="10" letter-spacing="1.2">CLEAN ARCHITECTURE · CONTINUOUS IMPROVEMENT</text>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="178" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>